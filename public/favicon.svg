<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" role="img">
  <defs>
    <!-- 主渐变 - 紫色到粉紫色 -->
    <linearGradient id="bgGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- 高光渐变 -->
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- 阴影渐变 - 使用紫色 -->
    <radialGradient id="shadowGradient" cx="50%" cy="50%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.8)" />
      <stop offset="100%" stop-color="rgba(167, 139, 250, 0.6)" />
    </radialGradient>

    <!-- 内发光 -->
    <radialGradient id="innerGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="rgba(221, 214, 254, 0.7)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0)" />
    </radialGradient>

    <!-- 外发光滤镜 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 3D阴影滤镜 -->
    <filter id="shadow3D">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆形 - 底层 -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient1)" filter="url(#shadow3D)" />

  <!-- 内发光层 -->
  <circle cx="32" cy="32" r="28" fill="url(#innerGlow)" opacity="0.6" />

  <!-- 3D高光层 -->
  <ellipse cx="26" cy="24" rx="18" ry="20" fill="url(#highlightGradient)" opacity="0.4" />

  <!-- 科技感网格线 -->
  <g opacity="0.2" stroke="white" stroke-width="0.5">
    <line x1="32" y1="2" x2="32" y2="62" />
    <line x1="2" y1="32" x2="62" y2="32" />
    <circle cx="32" cy="32" r="20" fill="none" />
    <circle cx="32" cy="32" r="10" fill="none" />
  </g>

  <!-- 代码大括号符号 - 3D效果 -->
  <g transform="translate(32, 32)" filter="url(#glow)">
    <!-- 左侧大括号 - 3D层叠 -->
    <g>
      <!-- 底层阴影 - 使用紫色 -->
      <path d="M -10 -16 Q -14 -16 -14 -12 L -14 -8 Q -14 -4 -10 -4 Q -14 4 -14 8 L -14 12 Q -14 16 -10 16"
            stroke="rgba(124, 58, 237, 0.5)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
            transform="translate(1, 1)" />

      <!-- 中间层 -->
      <path d="M -10 -16 Q -14 -16 -14 -12 L -14 -8 Q -14 -4 -10 -4 Q -14 4 -14 8 L -14 12 Q -14 16 -10 16"
            stroke="rgba(192, 132, 252, 0.9)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
            transform="translate(0.5, 0.5)" />

      <!-- 顶层高光 -->
      <path d="M -10 -16 Q -14 -16 -14 -12 L -14 -8 Q -14 -4 -10 -4 Q -14 4 -14 8 L -14 12 Q -14 16 -10 16"
            stroke="white"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none" />
    </g>

    <!-- 中间连接线 -->
    <line x1="-7" y1="0" x2="7" y2="0"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round" />

    <!-- 右侧大括号 - 3D层叠 -->
    <g>
      <!-- 底层阴影 - 使用紫色 -->
      <path d="M 10 -16 Q 14 -16 14 -12 L 14 -8 Q 14 -4 10 -4 Q 14 4 14 8 L 14 12 Q 14 16 10 16"
            stroke="rgba(124, 58, 237, 0.5)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
            transform="translate(1, 1)" />

      <!-- 中间层 -->
      <path d="M 10 -16 Q 14 -16 14 -12 L 14 -8 Q 14 -4 10 -4 Q 14 4 14 8 L 14 12 Q 14 16 10 16"
            stroke="rgba(192, 132, 252, 0.9)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
            transform="translate(0.5, 0.5)" />

      <!-- 顶层高光 -->
      <path d="M 10 -16 Q 14 -16 14 -12 L 14 -8 Q 14 -4 10 -4 Q 14 4 14 8 L 14 12 Q 14 16 10 16"
            stroke="white"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none" />
    </g>

    <!-- 中心规则判断点 - 3D效果 -->
    <g>
      <!-- 外圈阴影 - 使用紫色 -->
      <circle cx="0" cy="0" r="5" fill="rgba(167, 139, 250, 0.4)" transform="translate(1, 1)" />
      <!-- 中间层 -->
      <circle cx="0" cy="0" r="4.5" fill="rgba(192, 132, 252, 0.8)" transform="translate(0.3, 0.3)" />
      <!-- 顶层高光 -->
      <circle cx="0" cy="0" r="4" fill="url(#highlightGradient)" />
      <!-- 内高光 -->
      <circle cx="-1" cy="-1" r="1.5" fill="white" opacity="0.8" />
    </g>
  </g>

  <!-- 科技感装饰点 -->
  <g opacity="0.7">
    <circle cx="20" cy="16" r="1.5" fill="#a78bfa" filter="url(#glow)" />
    <circle cx="44" cy="16" r="1.5" fill="#c084fc" filter="url(#glow)" />
    <circle cx="20" cy="48" r="1.5" fill="#c084fc" filter="url(#glow)" />
    <circle cx="44" cy="48" r="1.5" fill="#a78bfa" filter="url(#glow)" />
  </g>

  <!-- 顶部高光反射 -->
  <ellipse cx="32" cy="18" rx="12" ry="8" fill="white" opacity="0.15" />
</svg>
